name: Site
# Cloudflare Pages builds and deploys the site from its Git integration
# (README → Hosting); this workflow only checks it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # go-import tags, CSP hashes and local links.
      - name: Check the site
        run: python3 scripts/check.py
      # The Cloudflare Pages build command; fails if a served file is missing.
      - name: Stage the site
        run: scripts/stage.sh
