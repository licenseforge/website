<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Go vanity import for every path under licenseforge.io/licenseforge/ (packages and nested modules such as
       sdk/go). Static hosts serve this page for any missing path; `go get` reads go-import from the body whatever
       the status (cmd/go reports the status only when no go-import tag is found), so no rewrite rules are needed.
       Keep it identical to licenseforge/index.html and in the head: cmd/go stops reading at the body tag. -->
  <meta name="go-import" content="licenseforge.io/licenseforge git https://github.com/licenseforge/licenseforge">
  <meta name="go-source" content="licenseforge.io/licenseforge https://github.com/licenseforge/licenseforge https://github.com/licenseforge/licenseforge/tree/main{/dir} https://github.com/licenseforge/licenseforge/blob/main{/dir}/{file}#L{line}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Not found · LicenseForge</title>
  <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #0c0a09; color: #f5efe9; font: 17px/1.6 ui-sans-serif, system-ui, sans-serif; padding: 16px; text-align: center; }
    h1 { font-size: 2.4rem; margin: 16px 0 8px; letter-spacing: -.02em; }
    p { color: #a8a09a; }
    a { color: #ffb347; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/img/logo.svg" alt="" width="48" height="48" style="margin:auto">
    <h1>Nothing here.</h1>
    <p>Looking for a Go package? <code>go get licenseforge.io/licenseforge/sdk/go</code> works from this domain.</p>
    <p><a href="/">Back to LicenseForge</a></p>
  </main>
</body>
</html>
