<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LicenseForge</title>
  <meta name="description" content="Open-source, Kubernetes-native software licensing. Products, features and plans; signed licenses that work online and air-gapped.">
  <link rel="canonical" href="https://licenseforge.io/">
  <style>
    :root { color-scheme: light dark; --fg: #111; --bg: #fff; --muted: #555; }
    @media (prefers-color-scheme: dark) { :root { --fg: #eee; --bg: #111; --muted: #aaa; } }
    body { margin: 0; font: 18px/1.6 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    main { max-width: 40rem; margin: 15vh auto; padding: 0 16px; }
    p { color: var(--muted); }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>LicenseForge</h1>
    <p>Open-source, Kubernetes-native software licensing. Define products, features and plans; issue signed licenses that work online and in air-gapped environments.</p>
    <p>Coming soon. Follow along on <a href="https://github.com/licenseforge/licenseforge">GitHub</a>.</p>
  </main>
</body>
</html>
